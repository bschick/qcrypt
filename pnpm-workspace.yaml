packages:
  - 'apps/*'
  - 'libs/*'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  less: true
  lmdb: true
  msgpackr-extract: true
  nx: true

minimumReleaseAgeExclude:
  - '@angular-devkit/architect@0.2202.6'
  - '@angular-devkit/core@22.2.6'
  - '@angular-devkit/schematics@22.2.6'
  - '@angular/build@22.2.6'
  - '@angular/cli@22.2.6'
  - '@schematics/angular@22.2.6'
