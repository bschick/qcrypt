version: 2
updates:
  # Actions are pinned to commit SHAs, which Dependabot rewrites in place and annotates with the
  # matching version. Without this, a pinned SHA never moves and silently ages.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # crux PRs fail crux.spec.ts until pnpm build:libs:crux regenerates the artifacts on that branch
  - package-ecosystem: "cargo"
    directory: "/libs/crypto/crux"
    schedule:
      interval: "weekly"
    groups:
      crux:
        patterns:
          - "*"
  - package-ecosystem: "rust-toolchain"
    directory: "/libs/crypto/crux"
    schedule:
      interval: "weekly"
