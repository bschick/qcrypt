name: Release Tagged Tests
permissions:
  contents: read
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
jobs:

  unittest:
    timeout-minutes: 180
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: lts/*
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps
    - name: Run vitest chrome & webkit unit tests
      run: pnpm test:web:most
    - name: Run server unit tests
      run: pnpm test:server
    - name: Run library unit tests
      run: pnpm test:libs
    - name: Run cli unit tests
      run: pnpm test:cli

  e2etest:
    timeout-minutes: 180
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: lts/*
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps
    - name: Restore keeper credentials
      env:
        E2E_CREDS_B64: ${{ secrets.E2E_CREDS_B64 }}
      run: |
        # Without the secret the keeper-dependent e2e tests detect the missing
        # keeper-creds directory and skip rather than fail.
        # Generate with: tar -czf - -C apps/web/tests keeper-creds | base64 -w0
        if [ -n "$E2E_CREDS_B64" ]; then
          echo "$E2E_CREDS_B64" | base64 -d | tar -xzf - -C apps/web/tests
          echo "Restored keeper credentials."
        else
          echo "No E2E_CREDS_B64 secret available; keeper tests will skip."
        fi
    - name: Run Playwright e2e prod tests
      run: pnpm test:e2e:prod
    - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      if: ${{ !cancelled() }}
      with:
        name: playwright-e2e-report
        path: playwright-report/
        retention-days: 30

  fuzztest:
    timeout-minutes: 240
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: lts/*
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps
    - name: Run Playwright e2e prod tests
      run: pnpm test:fuzz:prod
    - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      if: ${{ !cancelled() }}
      with:
        name: playwright-fuzz-report
        path: playwright-report/
        retention-days: 30
