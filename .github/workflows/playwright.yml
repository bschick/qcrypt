name: Push and PR Tests
permissions:
  contents: read
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:

  unittest:
    timeout-minutes: 180
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: lts/*
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps
    - name: Run vitest chrome unit tests
      run: pnpm test

  e2etest:
    timeout-minutes: 180
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: lts/*
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps
    - name: Qcrypt specific setup
      run: |
        cd apps/web/localssl/
        ./localssl.sh
    - name: Restore keeper credentials
      env:
        E2E_CREDS_B64: ${{ secrets.E2E_CREDS_B64 }}
      run: |
        # Forks and PRs from forks don't receive the secret; the keeper-dependent
        # e2e tests detect the missing keeper-creds directory and skip rather than fail.
        # Generate with: tar -czf - -C apps/web/tests keeper-creds | base64 -w0
        if [ -n "$E2E_CREDS_B64" ]; then
          echo "$E2E_CREDS_B64" | base64 -d | tar -xzf - -C apps/web/tests
          echo "Restored keeper credentials."
        else
          echo "No E2E_CREDS_B64 secret available; keeper tests will skip."
        fi
    - name: Run Playwright e2e tests
      # run_e2e.sh owns a frozen dev serve (no watch/live-reload). E2E_SERVE_LOG
      # makes it write the serve log to a known path for the artifact upload.
      env:
        E2E_SERVE_LOG: serve.log
      run: pnpm test:e2e
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: ${{ !cancelled() }}
      with:
        name: playwright-e2e-report
        path: playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: ${{ !cancelled() }}
      with:
        name: serve-log
        path: serve.log
        retention-days: 30
