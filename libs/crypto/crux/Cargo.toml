[package]
name = "qc-crux"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
libcrux-ml-dsa = { version = "0.0", features = ["mldsa65", "std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The producers section names the wasm-bindgen build, which differs between downloaded and locally built copies
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--strip-producers"]
